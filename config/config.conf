# =====================================================================
# Configurazione di default della simulazione.
# Tutti i parametri sono letti a runtime: modificarli NON richiede una
# nuova compilazione.
#
# I tempi (AVG_SRVC_*, pause, consumo, refill, STOP_DURATION) sono
# espressi in SECONDI DI TEMPO SIMULATO. La conversione in tempo reale
# passa da N_NANO_SECS: 1 minuto simulato = N_NANO_SECS nanosecondi reali.
# =====================================================================

# processi e risorse
NOF_WORKERS=8
NOF_USERS=100
NOF_TABLE_SEATS=40
AVG_CONSUMPTION_TIME=30        # secondi simulati per ciascun piatto acquistato

# postazioni per stazione
NOF_WK_SEATS_PRIMI=2
NOF_WK_SEATS_SECONDI=3
NOF_WK_SEATS_COFFEE=1
NOF_WK_SEATS_CASSA=2

# tempi medi di servizio (secondi simulati)
AVG_SRVC_PRIMI=30
AVG_SRVC_MAIN_COURSE=40
AVG_SRVC_COFFEE=15
AVG_SRVC_CASSA=20

# gestione porzioni
AVG_REFILL_PRIMI=20            # porzioni per tipo di piatto a inizio giornata
AVG_REFILL_SECONDI=20
MAX_PORZIONI_PRIMI=60
MAX_PORZIONI_SECONDI=60
AVG_REFILL_TIME=600            # intervallo medio fra due refill
REFILL_VARIABILITY_PERCENT=20  # +-20% attorno ad AVG_REFILL_TIME

# scelte dell'utente (probabilita' in percentuale)
PROB_GO_TO_MENSA=90
PROB_PRIMO=100
PROB_SECONDO_CONTORNO=80
PROB_DOLCE=40
PROB_CAFFE=70

# prezzi in centesimi (il contorno e' compreso nel prezzo del secondo)
PRICE_PRIMI=350
PRICE_SECONDI=450
PRICE_DOLCE=200
PRICE_COFFEE=100

# pause degli operatori
NOF_PAUSE=2
PAUSE_PROBABILITY=30
MIN_PAUSE_TIME=60              # secondi simulati
MAX_PAUSE_TIME=300

# gestione della simulazione
SIM_DURATION=5                 # giorni
DAY_DURATION=480               # minuti simulati per giornata
N_NANO_SECS=50000000           # 1 minuto simulato = 50 ms reali -> 24 s/giorno
OVERLOAD_THRESHOLD=50

# gruppi di utenti che pranzano insieme
MAX_USERS_PER_GROUP=4

# versione completa
STOP_DURATION=900              # durata del guasto alla cassa (secondi simulati)
N_NEW_USERS=10                 # utenti aggiunti da ./bin/add_users

# utenti con ticket
NOF_TICKET_READERS=3
AVG_SRVC_TICKET=10
TICKET_DISCOUNT_PCT=10
TICKET_PERCENTAGE=80

MENU_FILE_PATH=config/menu.txt
CSV_OUTPUT_DIR=output/
